# General Settings
project_name: ezDLT-GAN
prefix: "(prefix)"
save_dir: "auto"

# Dataset Settings
dataset:
  name: "MNIST"
  root_dataset: "./datasets/preprocessed/MNIST/train"
  image_size: [3, 64, 64]
  batch_size: 256

# Model Settings
model:
  type: "InversionGAN"
  z_size: 128
  nb_feat_maps: 128

  # InversionGAN Setting
  root_target_model: "./targets/ResNet18_MNIST.pth"
  type_target_model: "ResNet18"
  hidden_size: 1024
  layer_depth: 4
  nb_classes: 10
  
training:
  epochs: 2
  learning_rate: 0.0002